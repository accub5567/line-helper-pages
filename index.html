<h1>LINE 驗證碼小幫手</h1>
<p>這是一個私人使用的小工具，只提供帳戶擁有者指定的少數家人與朋友使用，不對外開放註冊，也不是商業服務。</p>

<h2>它做什麼</h2>
<p>唯讀存取擁有者的 Gmail，只用來找出線上服務寄來的驗證信，並把其中的驗證碼儲存，使用第三方工具發送給使用者。</p>

<h2>它存取哪些 Google 資料</h2>
<p>只有一項權限：唯讀存取 Gmail（<code>gmail.readonly</code>）。程式只搜尋線上服務寄來的驗證信，不寄信、不刪信、不修改任何郵件。</p>

<p>詳細的資料處理方式請見<a href="privacy.html">隱私權政策</a>。</p>
